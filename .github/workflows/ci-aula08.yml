name: CI — TechNova API

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'aula-08/**'
      - '.github/workflows/ci-aula08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aula-08/**'
      - '.github/workflows/ci-aula08.yml'
  workflow_dispatch:

concurrency:
  group: ci-aula08-${{ github.ref }}
  # Só cancela runs de PR; nunca interrompe uma publicação de imagem em andamento
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: aula-08/technova-api

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Verificar secret configurado
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          test -n "$AWS_DEFAULT_REGION" || { echo "Secret AWS_REGION não configurado"; exit 1; }
          # Valor fictício (não sensível): o GitHub o exibe mascarado como ***
          echo "AWS_REGION=$AWS_DEFAULT_REGION"

  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm run test:ci

      - name: Publicar relatório de coverage
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: aula-08/technova-api/coverage/
          retention-days: 14

  build:
    name: Build (Docker)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t technova-api:${{ github.sha }} .

      - name: Smoke test do container
        run: |
          docker run -d --name smoke -p 3000:3000 technova-api:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Remover container
        if: always()
        run: docker rm -f smoke

  push-image:
    name: Push (ghcr.io)
    needs: [lint, test, build]
    # Publica só em push para main ou em tag v*.*.* — nunca em pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/technova-api
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: aula-08/technova-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-comment:
    name: Comentário no PR
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comentar resultado do CI no PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## CI — TechNova API',
                '',
                '| Estágio | Status |',
                '|---------|--------|',
                '| Lint (ESLint) | ✅ |',
                '| Tests (Jest, Node 18 e 20) | ✅ |',
                '| Build (Docker + smoke test) | ✅ |',
                '',
                `Commit: \`${context.sha.substring(0, 7)}\``,
              ].join('\n'),
            });
