name: Terraform Plan

# GitOps: plan no PR, comentado para revisão. Quem aplica é o terraform-apply.yml (merge).
on:
  pull_request:
    branches: [main]
    paths:
      - 'aula-10/terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read # ler o código
  pull-requests: write # comentar o plan no PR

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Learner Lab exige
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=technova-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan > plan.txt 2>&1
          code=$?
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if grep -Eq 'will be destroyed|must be replaced' plan.txt; then
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Comentar plan no PR (atualiza o comentário existente)
        uses: actions/github-script@v7
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          HAS_DESTROY: ${{ steps.plan.outputs.destroy }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-aula10 -->';
            let plan = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/${process.env.TF_WORKING_DIR}/plan.txt`, 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n\n... (output truncado; veja o log do workflow)';
            }
            const failed = process.env.PLAN_EXIT !== '0';
            const warn = process.env.HAS_DESTROY === 'true'
              ? '> ⚠️ **Este plan DESTRÓI ou RECRIA recursos.** Revise com atenção antes do merge — o apply roda automático.\n\n'
              : '';
            const body = `${marker}
            #### Terraform Plan ${failed ? '❌ falhou' : '📖'}

            ${warn}<details><summary>Mostrar plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            *Atualizado por @${context.actor} em \`${context.payload.pull_request.head.ref}\` (${context.sha.slice(0, 7)})*`
              .split('\n').map(l => l.replace(/^ {12}/, '')).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Falhar se o plan falhou
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
