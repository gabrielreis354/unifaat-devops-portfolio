name: Terraform Apply

# GitOps: o merge na main é a aprovação; só o pipeline executa apply.
on:
  push:
    branches: [main]
    paths:
      - 'aula-10/terraform/**'

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: aula-10/terraform

# Nunca cancelar um apply em andamento (corromperia o state)
concurrency:
  group: terraform-aula10-state
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Learner Lab exige
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=technova-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color

      - name: Outputs
        run: |
          {
            echo "### Terraform Apply concluído (${GITHUB_SHA::7})"
            echo '```'
            terraform output
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
